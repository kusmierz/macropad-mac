# Profiles for the daemon — what each key and knob does, per app.
#
# Copy this to profiles.yaml and edit it. The daemon reloads the file automatically
# when you save, so you do not need to restart it.
#
# Targets:  key5 … key16     (keys; see the README illustration)
#           knob1.left / knob1.press / knob1.right   (and knobs 2–4)
#
# Actions:
#   media:playpause  media:next  media:prev  media:mute
#   media:volumeup   media:volumedown
#   key:cmd+shift+4  — send a key combination
#   app:Spotify      — activate or launch an app
#   url:https://…    — open a URL
#   shell:…          — run a command
#   none             — swallow the signal; do nothing

default:
  # Knob 4 (large) — volume
  knob4.left:   media:volumedown
  knob4.press:  media:mute
  knob4.right:  media:volumeup

  # Knob 3 (medium) — media transport. The pad cannot handle these actions itself;
  # the daemon sends them through macOS media APIs.
  knob3.left:   media:prev
  knob3.press:  media:playpause
  knob3.right:  media:next

  # Knob 2 (small) — scroll text
  knob2.left:   key:up
  knob2.press:  key:enter
  knob2.right:  key:down

  # Knob 1 (small) — zoom
  knob1.left:   key:cmd+minus
  knob1.press:  key:cmd+0
  knob1.right:  key:cmd+shift+equal

  # Keys
  key5:  key:cmd+c
  key6:  key:cmd+v
  key7:  key:cmd+x
  key8:  key:cmd+z
  key9:  key:cmd+shift+z
  key10: key:cmd+a
  key11: key:cmd+shift+4
  key12: app:Finder
  key13: key:cmd+w
  key14: shell:open -a Spotify
  key15: url:https://github.com/GaimsDevSoftware/macropad-mac
  key16: key:cmd+space

# App-specific overrides. The key matches the bundle ID of the frontmost app
# (a case-insensitive substring). Any action not overridden falls back to default.
apps:
  com.spotify.client:
    knob3.left:  media:prev
    knob3.right: media:next
    key5:        key:cmd+shift+left     # jump backward
    key7:        key:cmd+shift+right    # jump forward

  com.apple.finder:
    key12: key:cmd+shift+n              # new folder
    key13: key:cmd+delete               # move to Trash

  com.microsoft.VSCode:
    key5:  key:cmd+shift+p              # command palette
    key6:  key:ctrl+grave               # terminal
    knob1.left:  key:cmd+minus
    knob1.right: key:cmd+shift+equal
