# Example configuration for the XZKJ macropad (12 keys + 4 knobs)
# Flash with: .venv/bin/python macroctl.py flash config.example.yaml
# This example is for @XZKJ-12key_4knob.
model: xzkj_12key_4knob

layer: 1

# 4 rows x 3 columns, as the keyboard sits in front of you (row 1 = top)
keys:
  - ["cmd+c",       "cmd+v",       "cmd+x"]
  - ["cmd+z",       "cmd+shift+z", "cmd+a"]
  - ["cmd+tab",     "media:play",  "cmd+w"]
  - ["cmd+shift+4", "f13",         "f14"]

# Knobs 1-4: left = counter-clockwise, press = push, right = clockwise
knobs:
  1: {left: "media:volumedown", press: "media:mute", right: "media:volumeup"}
  2: {left: "media:prev",       press: "media:play", right: "media:next"}
  3: {left: "cmd+minus",        press: "cmd+0",      right: "cmd+shift+equal"}
  4: {left: "up",               press: "enter",      right: "down"}
