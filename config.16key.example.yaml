# Example configuration for XZKJ @XZKJ-16key_3knob (16 keys + 3 knobs).
# Flash with: .venv/bin/python macroctl.py flash config.16key.example.yaml
model: xzkj_16key_3knob
layer: 1

# Describe how the pad is positioned. Use left/right for horizontal pads and
# top/bottom for vertical pads.
orientation: horizontal
knobs_location: right

# 4 rows x 4 columns, as the keyboard sits in front of you (row 1 = top)
keys:
  - ["cmd+c", "cmd+v", "cmd+x", "cmd+z"]
  - ["cmd+a", "cmd+w", "cmd+tab", "cmd+shift+4"]
  - ["f13", "f14", "f15", "f16"]
  - ["media:volumeup", "media:volumedown", "media:mute", "enter"]

# Knobs are numbered top-to-bottom on the left/right edge. left =
# counter-clockwise, press = push, right = clockwise.
knobs:
  1: {left: "media:prev", press: "media:play", right: "media:next"}
  2: {left: "cmd+minus", press: "cmd+0", right: "cmd+shift+equal"}
  3: {left: "up", press: "enter", right: "down"}
